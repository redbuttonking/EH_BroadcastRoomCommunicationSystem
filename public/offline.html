<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>연결 확인 · 예배 소통 시스템</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        min-height: 85vh;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 22px;
      }
      p {
        line-height: 1.8;
      }
      button {
        font: inherit;
        min-height: 48px;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>인터넷 연결을 확인해 주세요.</h1>
    <p>연결되면 다시 시도해 주세요.<br />방이 열려 있다면 다시 입장할 수 있습니다.</p>
    <button onclick="location.reload()">다시 연결</button>
  </body>
</html>
