<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>연결 확인 · 예배 소통 시스템</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f4f0;
        --ink: #252e2a;
        --muted: #5e6a61;
        --accent: #425e4d;
        --accent-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #171b1c;
          --ink: #eeeee7;
          --muted: #a2aca7;
          --accent: #bdd0b5;
          --accent-ink: #1b2b20;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 24px;
        text-align: center;
        padding: 24px;
        color: var(--ink);
        background: var(--canvas);
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.4;
        margin: 0;
      }
      p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        min-height: 46px;
        padding: 12px 18px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--accent-ink);
        background: var(--accent);
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.94);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <h1>인터넷 연결을 확인해 주세요.</h1>
    <p>연결되면 다시 시도해 주세요.<br />방이 열려 있다면 다시 입장할 수 있습니다.</p>
    <button onclick="location.reload()">다시 연결</button>
  </body>
</html>
